name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag mermaid-validator:test .

      - name: Validate a mounted Mermaid file
        run: >-
          docker run --rm
          --volume "$PWD/test/fixtures:/work:ro"
          mermaid-validator:test valid.mmd

      - name: Reject invalid stdin
        run: |
          if printf 'flowchart LR\n  A -- B\n' | docker run --rm -i mermaid-validator:test; then
            echo "Expected invalid Mermaid syntax to fail" >&2
            exit 1
          fi
